<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>EquationForge</title>

    <!-- Microsoft Office JavaScript API -->
    <script
        type="text/javascript"
        src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js">
    </script>

    <!-- Our styles -->
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <main class="equationforge">
        <header class="app-header">
            <h1>EquationForge</h1>
            <p>Mathematical Formula Editor</p>
        </header>

        <section class="editor-section">

            <div class="control-row">
                <label for="font-select">Font</label>

                <select id="font-select">
                    <option value="Arial">Arial</option>
                    <option value="Times New Roman">Times New Roman</option>
                    <option value="Cambria Math">Cambria Math</option>
                    <option value="Calibri">Calibri</option>
                    <option value="Georgia">Georgia</option>
                </select>
            </div>

            <div class="control-row">
                <label for="font-size">Size</label>

                <select id="font-size">
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12" selected>12</option>
                    <option value="14">14</option>
                    <option value="16">16</option>
                    <option value="18">18</option>
                    <option value="20">20</option>
                    <option value="24">24</option>
                </select>
            </div>

            <div class="control-group">
                <label for="equation-input">Equation</label>

                <textarea
                    id="equation-input"
                    placeholder="Type an equation..."
                    spellcheck="false"
                >x^2 + y^2 = z^2</textarea>
            </div>

            <div class="formula-buttons">
    <button type="button" id="fraction-button">
        Fraction
    </button>

    <button type="button" id="radical-button">
        √ Root
    </button>
</div>

            <div class="preview-section">

                <label>Preview</label>

                <div id="equation-preview" class="equation-preview">
                    x² + y² = z²
                </div>
            </div>

            <button id="insert-equation" class="primary-button">
                Insert Equation
            </button>

            <p id="status-message" class="status-message"></p>

        </section>
    </main>
</body>
</html>
